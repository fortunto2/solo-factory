# Pre-commit hooks for solo-factory
# Install: make hooks (or: uvx pre-commit install)
# Run manually: uvx pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '^templates/'
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (local)
        entry: shellcheck
        args: [--severity=warning]
        language: system
        types: [shell]

  - repo: local
    hooks:
      - id: ty-check
        name: ty type-check (Python)
        # --with makes ty see the project's declared dependencies. Without
        # them it reported 7 unresolved-import diagnostics on every commit,
        # which is a sensor that is always red and therefore soon ignored.
        entry: uvx --with pyyaml --with rich ty check scripts/
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # The whole suite is 259s, and this file's own rules say a four-minute gate
      # gets bypassed with --no-verify — a bypassed gate being worse than none,
      # because you still believe it ran. blind_spots.bats is 113s of that 259 (44%)
      # and measures the verifier's coverage rather than guarding this commit, so it
      # runs in `make test` and in CI, not here. Named in the hook title so nobody
      # reads this gate as "all tests passed".
      - id: bats-tests
        name: BATS tests (all except the 113s blind-spot corpus)
        entry: bash -c 'bats $(ls tests/*.bats | grep -v blind_spots)'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: fixtures-intact
        name: Fixtures are broken on purpose and must stay broken
        entry: python3 scripts/check-fixtures
        language: system
        pass_filenames: false
        # Three things, not one. `fixtures/` is what it protects; the lint config
        # is what it protects AGAINST — remove force-exclude and ruff repairs the
        # fixtures on a commit this hook would have skipped; and its own script,
        # because a weakened guard should not ship unrun.
        files: '^(fixtures/|pyproject\.toml$|\.pre-commit-config\.yaml$|scripts/check-fixtures$)'
        stages: [pre-commit]

      - id: sensor-contract
        name: Every sensor obeys the published skip contract
        entry: python3 scripts/check-sensor-contract
        language: system
        pass_filenames: false
        # Plus its own script: a guard that stops guarding must not ship unrun.
        files: '^scripts/(solo-verify|check-sensor-contract)$'
        stages: [pre-commit]

      - id: vacuous-tests
        name: Tests that cannot fail (assert only absence)
        entry: python3 scripts/check-vacuous-tests
        language: system
        # Must stay in step with TEST_FILE in the script; a test asserts they do.
        files: '(\.bats$|(^|/)test_[^/]*\.py$|[._]test\.[jt]sx?$|\.spec\.[jt]sx?$)'
        stages: [pre-commit]

      - id: vacuous-tests-sweep
        name: A weakened vacuous-test checker must not ship unrun
        entry: python3 scripts/check-vacuous-tests
        language: system
        # Separate entry because the SHAPE differs: the hook above is per-file and
        # this one is a whole-repo sweep. Adding the script to the pattern above
        # instead made pre-commit hand the script's own path to a checker that
        # correctly answers "that is not a test file" — UNKNOWN, exit 2, on every
        # commit touching it. A guard's own change needs a different call, not a
        # wider filter.
        pass_filenames: false
        files: '^scripts/check-vacuous-tests$'
        stages: [pre-commit]

      - id: skill-triggers
        name: Skill trigger validation
        entry: python3 scripts/validate_triggers.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: skill-frontmatter
        name: Skill frontmatter (name matches dir, description, version)
        entry: python3 scripts/check_skills.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: env-sensitive-calls
        name: Calls the environment can redirect, and whether they defend
        entry: python3 scripts/list-env-sensitive-calls
        language: system
        pass_filenames: false
        files: \.(py)$|^scripts/list-env-sensitive-calls$
