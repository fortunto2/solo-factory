<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground:#0b0b12; --ink:#f5f3ee; --accent:#ff5a36; --font-display: "Helvetica Neue", Arial, sans-serif; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:var(--ground); }
      #root { position:relative; width:100%; height:100%; font-family:var(--font-display); color:var(--ink); }
      #glow { position:absolute; left:140px; top:560px; width:800px; height:800px; border-radius:50%;
              background:radial-gradient(circle, var(--accent) 0%, transparent 65%); opacity:0; }
      #kicker { position:absolute; left:140px; top:700px; font-size:38px; letter-spacing:0.28em; text-transform:uppercase; color:var(--accent); }
      #title { position:absolute; left:140px; top:780px; width:800px; font-size:112px; line-height:1.18; font-weight:800; letter-spacing:-0.04em; }
      #title .line { display:block; overflow:hidden; padding-bottom:6px; }
      #title .line span { display:inline-block; }
      #rule { position:absolute; left:140px; top:1130px; height:8px; width:420px; transform-origin:0 50%; background:var(--accent); }
      #sub { position:absolute; left:140px; top:1180px; font-size:44px; opacity:0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="glow" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="kicker" class="clip" data-start="0" data-duration="6" data-track-index="1">New release</div>
      <h1 id="title" class="clip" data-start="0" data-duration="6" data-track-index="2">
        <span class="line"><span>Ship video</span></span>
        <span class="line"><span>from HTML.</span></span>
      </h1>
      <div id="rule" class="clip" data-start="0" data-duration="6" data-track-index="3"></div>
      <p id="sub" class="clip" data-start="0" data-duration="6" data-track-index="4">Same input, same frames.</p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#glow", { opacity: 0.55, scale: 1.25, duration: 5.5, ease: "sine.inOut" }, 0);
      // Frame 0 already shows kicker + title (it becomes the social thumbnail); motion starts at 0 from a visible state.
      tl.fromTo("#title", { scale: 1.08, transformOrigin: "0 50%" }, { scale: 1, duration: 5.5, ease: "power2.out" }, 0);
      tl.fromTo("#kicker", { x: -24 }, { x: 0, duration: 1.2, ease: "power3.out" }, 0);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 1.6);
      tl.fromTo("#sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 2.1);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
