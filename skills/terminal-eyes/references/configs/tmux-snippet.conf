# Without these, an agent running inside tmux loses notifications, the progress
# bar, Shift+Enter and truecolor — all of which look like bugs in the agent.

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Truecolor through to the outer terminal. Name the TERM your terminal sets.
set -ga terminal-features ',xterm-kitty:RGB'
set -ga terminal-features ',xterm-256color:RGB'

# Apply to a running server: tmux source-file ~/.tmux.conf
# terminal-features is read when a client attaches, so existing sessions need a
# re-attach to pick it up.
