# The reading-focused half of a kitty.conf. Merge into an existing config —
# keep the user's keybindings and launchers, change only these.

include theme-current.conf        # copy of theme-{light,dark}.conf; the switcher swaps it

font_family      JetBrains Mono
font_size        14.0
modify_font      cell_height 130%
text_composition_strategy platform
disable_ligatures cursor

# Nothing moves
repaint_delay         20          # default 10; try 16-30
input_delay           3
sync_to_monitor       yes
cursor_blink_interval 0
cursor_trail          0
visual_bell_duration  0
enable_audio_bell     no

# Bell as a badge, never a flash
bell_on_tab          "🔔 "
tab_activity_symbol  "•"
window_alert_on_bell yes
notify_on_cmd_finish unfocused 15.0

window_padding_width 12
scrollback_lines     20000

# Tabs over tiling: splits stay available but collapsed into one visible pane
enabled_layouts stack,splits
map ctrl+shift+z toggle_layout stack

# Needed for live palette switching and `kitty @` from hooks.
# listen_on only takes effect after a restart.
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}
