# claim-check config. Private copy lives outside the public repo.
out_dir: ~/claim-check            # intermediate files, evidence cache, queue.json
audience: elder_ru                # profile used by `queue run`
audiences:
  elder_ru:
    lang: ru
    address: ты                   # or вы
    call_them: ""                 # how the owner addresses the reader, set privately
    style: >-
      Large simple sentences, no jargon, warm, respectful. Their care for health is right;
      the video is what is wrong.
banned: []                        # extra words lint must refuse, on top of the built-in list
whisper_script: ~/path/to/solo-factory/skills/transcribe/scripts/transcribe_mlx.py
agent_cmd: "claude -p --permission-mode acceptEdits --allowedTools Bash,Read,Write,Edit,WebFetch,WebSearch"
agent_timeout_s: 1500
